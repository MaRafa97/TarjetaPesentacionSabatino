<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Director de Arte - Gemini AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-zinc-900 min-h-screen p-4 md:p-8 font-sans text-zinc-100 flex justify-center">
    
    <div id="app" class="w-full max-w-2xl flex flex-col h-[90vh]">
        <!-- La interfaz reactiva irá aquí -->
         <div id="app" class="w-full max-w-2xl flex flex-col h-[90vh] bg-zinc-800 rounded-2xl border border-zinc-700 shadow-2xl overflow-hidden">
        
        <!-- Header -->
        <header class="bg-zinc-900 border-b border-zinc-700 p-4">
            <h1 class="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 flex items-center gap-2">
                <svg class="w-6 h-6 text-blue-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 4.5l6.5 13.5H5.5L12 6.5z"/></svg>
                Director de Arte Automático
            </h1>
        </header>

        <!-- Zona de Resultados (Scrollable) -->
        <main class="flex-1 overflow-y-auto p-6 flex flex-col">
            
            <div v-if="!respuestaIA && !estaCargando" class="m-auto text-zinc-500 text-center max-w-sm">
                <p class="text-4xl mb-4">✨</p>
                <p>Describe tu proyecto de diseño gráfico y el motor de Google Gemini generará tu dirección de arte.</p>
            </div>

            <!-- Loader Visual -->
            <div v-if="estaCargando" class="flex flex-col items-center justify-center my-auto space-y-4">
                <div class="w-12 h-12 border-4 border-zinc-700 border-t-emerald-500 rounded-full animate-spin"></div>
                <span class="text-emerald-400 text-sm font-medium tracking-widest animate-pulse">EVALUANDO CONCEPTOS...</span>
            </div>

            <!-- Contenedor de Respuesta de la IA -->
            <div v-if="respuestaIA && !estaCargando" class="bg-zinc-700/50 p-6 rounded-xl border border-zinc-600 shadow-inner text-zinc-200 whitespace-pre-wrap leading-relaxed">
                {{ respuestaIA }}
            </div>

        </main>

        <!-- Zona de Input (Controles) -->
        <footer class="p-4 bg-zinc-900 border-t border-zinc-700">
            <div class="flex gap-2">
                <input 
                    v-model="promptUsuario" 
                    @keyup.enter="consultarIA"
                    :disabled="estaCargando"
                    type="text" 
                    placeholder="Ej. Diseño UI para una app bancaria futurista..."
                    class="flex-1 bg-zinc-800 border border-zinc-600 rounded-xl px-4 py-3 text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-blue-500 transition-colors disabled:opacity-50"
                >
                <button 
                    @click="consultarIA" 
                    :disabled="estaCargando || !promptUsuario.trim()"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-semibold transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center min-w-[100px]"
                >
                    <span v-if="!estaCargando">Generar</span>
                    <span v-else class="text-xs">⏳</span>
                </button>
            </div>
        </footer>

    </div>


    </div>


    <script>
    const { createApp, ref } = Vue;

    createApp({
        setup() {
            // 1. Estado Reactivo
            const promptUsuario = ref('');
            const respuestaIA = ref('');
            const estaCargando = ref(false);
            
            // EL ALUMNO DEBE PEGAR SU LLAVE AQUÍ:
            const GEMINI_API_KEY = '';

            const consultarIA = async () => {
                if (!promptUsuario.value.trim() || !GEMINI_API_KEY) {
                    alert("Asegúrate de escribir un prompt y colocar tu API Key.");
                    return;
                }

                estaCargando.value = true;
                respuestaIA.value = ''; 

                // 1. La URL queda limpia, sin el '?key=' al final
                const url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent';

                const payload = {
                    systemInstruction: {
                        parts: [{ 
                            text: "Eres un Director de Arte experto. Responde de forma concisa sugiriendo conceptos visuales, tipografías y paletas de colores en hexadecimal. Usa viñetas." 
                        }]
                    },
                    contents: [{
                        parts: [{ 
                            text: promptUsuario.value 
                        }]
                    }],
                    generationConfig: {
                        temperature: 0.7
                    }
                };

                try {
                    const respuesta = await fetch(url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            // 2. Inyectamos la llave en la cabecera, tal como lo pide el formato AQ.
                            'x-goog-api-key': GEMINI_API_KEY
                        },
                        body: JSON.stringify(payload)
                    });

                    if (!respuesta.ok) {
                        throw new Error(`Error HTTP: ${respuesta.status}`);
                    }

                    const datos = await respuesta.json();
                    respuestaIA.value = datos.candidates[0].content.parts[0].text;

                } catch (error) {
                    console.error("Fallo técnico:", error);
                    respuestaIA.value = "❌ Hubo un error de conexión con la IA. Revisa la consola.";
                } finally {
                    estaCargando.value = false;
                    promptUsuario.value = ''; 
                }
            };

            return { promptUsuario, respuestaIA, estaCargando, consultarIA }
        }
    }).mount('#app');
</script>
</body>
</html>
